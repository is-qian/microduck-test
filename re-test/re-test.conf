# re-test.sh configuration. Env vars override these values.
# Modules for SKIP: bt wifi cam spk mic nfc tof imu led fan servo

DURATION=0            # seconds, 0 = run until Ctrl-C
TEMP_MAX=85000        # millidegree, overheat protection
SKIP=

# bluetooth gamepad MAC; bt module disabled when empty
BT_MAC=

# dynamixel bus (servos + GD32 id 200)
SERVO_IDS=auto        # "1 2 3" or auto = scan, excluding GD32 200
SERVO_BAUD=1000000    # 57600 or 1000000; devices are reconfigured first, restored to 1M on exit
SERVO_CENTER=2048     # zero position
SERVO_AMP=284         # swing amplitude, 284 = 25 deg
SERVO_VEL=10          # profile velocity, 0.229 rpm/unit -> ~1.8 s per 25 deg
SERVO_PERIOD=3        # seconds per half-swing

# mic duty cycle, seconds
MIC_REC=5
MIC_PAUSE=5

FAN_PWM=255           # 0-255

# tool paths
DXL=/opt/microduck-test/dxl/dxl
TOF=/opt/microduck-test/tof/vl53l8cx-test
NFC=/opt/microduck-test/nfc/nfc-test
