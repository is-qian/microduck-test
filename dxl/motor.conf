# Dynamixel motor batch configuration: up to 16 [groupN] sections, applied in
# order; a group is skipped when no motor answers at its current settings.
# Baud rates: 9600 / 57600 / 115200 / 1000000 / 2000000 / 3000000 / 4000000 / 4500000
[motor]
port = /dev/ttyS3

# # group numbers need not be contiguous; commented-out sections are ignored
# [group1]
# current_baud = 57600
# current_id = 1
# target_baud = 1000000
# target_id = 34

[group2]
current_baud = 1000000
current_id = 1
target_baud = 1000000
target_id = 34

[group3]
current_baud = 1000000
current_id = 2
target_baud = 1000000
target_id = 33

